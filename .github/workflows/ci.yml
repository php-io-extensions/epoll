name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        php: ['8.4', '8.5']
        ts: [nts, zts]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Build
        run: |
          phpize
          ./configure --enable-epoll
          make -j"$(nproc)"

      - name: Load
        run: |
          php -n -d extension="$PWD/modules/epoll.so" -r 'exit(extension_loaded("epoll") ? 0 : 1);'
          php -n -d extension="$PWD/modules/epoll.so" --ri epoll
